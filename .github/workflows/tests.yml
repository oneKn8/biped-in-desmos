name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: README claims (saved graph files, numpy seed 0 reaches the walking test)
        run: python test_readme_claims.py
      - name: Trainer tests
        working-directory: proto/sweep
        run: |
          python test_train.py
          python test_long_train.py
      - name: Builds a Desmos test episode and its numpy expectation
        run: python check_desmos.py prepare zero 12 "$RUNNER_TEMP/test.json" "$RUNNER_TEMP/expected.json"
